<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avatar Thumbnail Generator</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b1119;
      }

      body {
        display: grid;
        place-items: center;
      }

      model-viewer {
        width: 320px;
        height: 320px;
        background: radial-gradient(circle at 50% 20%, #152435 0%, #0b1119 70%);
      }
    </style>
  </head>
  <body>
    <model-viewer
      id="mv"
      exposure="1"
      camera-controls
      disable-zoom
      interaction-prompt="none"
      shadow-intensity="0.55"
      environment-image="neutral"
    ></model-viewer>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const src = params.get("model") || "";
      const viewer = document.getElementById("mv");

      if (!src) {
        document.body.classList.add("ready");
      } else {
        viewer.src = src;
        viewer.addEventListener(
          "load",
          () => {
            setTimeout(() => document.body.classList.add("ready"), 420);
          },
          { once: true }
        );
        viewer.addEventListener(
          "error",
          () => {
            document.body.classList.add("ready");
          },
          { once: true }
        );
      }
    </script>
  </body>
</html>
